<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="smcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2942" />
      <stop offset="100%" stop-color="#0B1E32" />
    </linearGradient>
    <linearGradient id="anchorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <!-- Background Shield/Circle -->
  <rect width="64" height="64" rx="14" fill="url(#smcGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Anchor & Medical Cross Fusion -->
  <!-- Top Ring -->
  <circle cx="32" cy="14" r="5" fill="none" stroke="url(#anchorGrad)" stroke-width="3" />
  
  <!-- Central Shaft -->
  <line x1="32" y1="19" x2="32" y2="52" stroke="url(#anchorGrad)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Horizontal Stock / Medical Cross Bar -->
  <rect x="20" y="23" width="24" height="6" rx="2" fill="#38BDF8" />
  <!-- Medical Red/White Cross in Center -->
  <rect x="29" y="21" width="6" height="10" rx="1" fill="#FFFFFF" />
  <rect x="27" y="23" width="10" height="6" rx="1" fill="#FFFFFF" />
  <rect x="30" y="22" width="4" height="8" rx="0.5" fill="#EF4444" />
  <rect x="28" y="24" width="8" height="4" rx="0.5" fill="#EF4444" />
  
  <!-- Bottom Flukes / Curved Anchor Arms -->
  <path d="M 15 38 C 15 52, 49 52, 49 38" fill="none" stroke="url(#anchorGrad)" stroke-width="3.5" stroke-linecap="round" />
  <!-- Left & Right Arrow Tips -->
  <polygon points="11,38 15,32 19,38" fill="#38BDF8" />
  <polygon points="45,38 49,32 53,38" fill="#38BDF8" />
</svg>
